name: GF-OCT Phase 1A Falsification

on:
  push:
    branches: ["main", "phase1a-falsification"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  phase1a:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit tests
        run: pytest -q
      - name: Run preregistered falsification
        run: gf-oct-phase1a --prereg preregistration/phase1a.freeze.json --out results/phase1a
      - name: Show decision
        run: cat results/phase1a/decision.json
      - name: Upload Phase 1A artifact
        uses: actions/upload-artifact@v4
        with:
          name: gf-oct-phase1a-results
          path: results/phase1a/
