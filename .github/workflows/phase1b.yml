name: GF-OCT Phase 1B Real-Flow Confirmatory

on:
  push:
    branches: ["phase1b-real-flow"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  phase1b:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit tests
        run: pytest -q
      - name: Phase 1B preregistration preflight / analysis
        run: |
          gf-oct-phase1b \
            --prereg preregistration/phase1b.freeze.json \
            --data data/phase1b/flow_transitions.csv \
            --out results/phase1b
      - name: Show execution status
        run: cat results/phase1b/execution_status.json
      - name: Upload Phase 1B status/results
        uses: actions/upload-artifact@v4
        with:
          name: gf-oct-phase1b-results
          path: results/phase1b/
