[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gf-oct"
version = "0.2.0"
description = "Preregistered falsification engine for Google Flow Optimal Control Theory"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
gf-oct-phase1a = "gf_oct.cli:main"
gf-oct-phase1b = "gf_oct.phase1b:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
